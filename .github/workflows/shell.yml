name: Shell 检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装检查工具
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck python3-yaml
      - name: Bash 语法检查
        run: for script in install.sh tests/*.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: shellcheck -x install.sh tests/test.sh tests/recovery.sh tests/ipv6.sh
      - name: 执行测试
        run: bash tests/test.sh
